[project]
name = "report-ocr-hybrid"
version = "0.3.0"
description = "Classical and TensorFlow U-Net segmentation for handwritten math"
requires-python = ">=3.12,<3.13"
dependencies = ["tensorflow==2.21.0", "keras==3.15.1", "numpy>=1.26,<2.3", "scipy>=1.14,<2", "pillow>=11,<12", "matplotlib>=3.10,<3.11"]

[project.optional-dependencies]
gpu = ["tensorflow[and-cuda]==2.21.0; sys_platform == 'linux'"]

[project.scripts]
ocr-segment = "ocr_keras.segmentation.final:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_keras"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
